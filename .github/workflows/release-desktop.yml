name: Instaladores de escritorio

# Se ejecuta al subir una etiqueta v* (por ejemplo v0.1.0) o a mano desde la pestaña Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: frontend/release/*.exe
          - os: ubuntu-latest
            script: dist:linux
            files: frontend/release/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: https://respira-ogd8.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: respira-${{ matrix.os }}
          path: ${{ matrix.files }}
      - name: Publicar en la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
